name: test

# Deployment is handled by the Cloudflare Git integration: a push to main runs a
# config-less `wrangler deploy`, which picks up wrangler.jsonc. It has no build
# step, so anything the site needs at runtime must be committed — that is why
# web/ledger/ is in git and test/assets.test.js guards it.
#
# This workflow exists to catch what that integration does not run: the tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Deployment still answers
        # Read-only, and retried because the deploy from this push may still be
        # in flight. If the Worker lands without its script, /api/head 404s and
        # this fails the run instead of leaving a silently broken site.
        run: |
          sleep 20
          for attempt in 1 2 3 4 5 6; do
            if node scripts/health.mjs; then
              exit 0
            fi
            echo "attempt $attempt failed; waiting for the deploy"
            sleep 15
          done
          exit 1
