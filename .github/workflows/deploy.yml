name: deploy

# Push-triggered deploy for both Workers.
#
# Workers Builds also has a Git connection for this repo, but an API-created
# connection cannot carry the GitHub App grant, so it fails at initialisation
# ("unable to verify Worker"). This workflow does the same job with a repo
# secret and no external app.
#
# One-time setup:
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#      Template: "Edit Cloudflare Workers" (Workers Scripts:Edit, Account
#      Settings:Read, D1:Edit for the schema check)
#   2. GitHub -> Settings -> Secrets and variables -> Actions
#      New secret: CLOUDFLARE_API_TOKEN = <token>
#
# Until the secret exists the deploy steps are skipped and the workflow stays
# green, so pushes do not produce false failures.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build browser assets
        run: node scripts/build-assets.mjs

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"
            exit 0
          fi
          npx wrangler d1 execute nhforum --remote --file worker/schema.sql

      - name: Deploy nhforum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::skipping deploy (no token)"
            exit 0
          fi
          npx wrangler deploy -c wrangler.jsonc

      - name: Deploy nhs-epqsocketio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::skipping deploy (no token)"
            exit 0
          fi
          npx wrangler deploy -c wrangler.realtime.jsonc

      # A deploy can succeed while leaving the Worker without its script: the
      # assets upload, every /api route 404s, and nothing reports an error.
      # Smoke tests assert the API actually answers, so that becomes a red run.
      - name: Verify the deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::skipping verification (no token)"
            exit 0
          fi
          node scripts/smoke.mjs https://nhforum.hheylau.workers.dev
          node scripts/smoke-realtime.mjs https://nhs-epqsocketio.hheylau.workers.dev
